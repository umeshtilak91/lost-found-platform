
name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: lost_found_db
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lost_found_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      GOOGLE_CLIENT_ID: test-client-id
      GOOGLE_CLIENT_SECRET: test-client-secret
      SESSION_SECRET: test-session-secret-for-ci-only

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Initialize test database schema
        env:
          PGPASSWORD: admin
        run: psql -h localhost -p 5434 -U postgres -d lost_found_db -f test-db/schema.sql

      - name: Seed test database
        env:
          PGPASSWORD: admin
        run: psql -v ON_ERROR_STOP=1 -h localhost -p 5434 -U postgres -d lost_found_db -f test-db/seed.sql

      - name: Run backend tests
        run: npx jest --runInBand
