{{- if .Values.monitoring.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: lost-found-api
  labels: {{- include "lf.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  endpoints:
    - { port: http, path: /metrics, interval: 30s }
{{- end }}
{{- if .Values.monitoring.prometheusRule.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: lost-found-alerts
  labels: {{- include "lf.labels" . | nindent 4 }}
spec:
  groups:
    - name: lost-found.rules
      rules:
        - alert: LostFoundApiHighErrorRate
          expr: |
            sum(rate(http_request_duration_seconds_count{status=~"5.."}[5m]))
              / clamp_min(sum(rate(http_request_duration_seconds_count[5m])), 1) > 0.02
          for: 10m
          labels: { severity: page }
          annotations:
            summary: API 5xx rate above 2% for 10 minutes
        - alert: LostFoundApiSlow
          expr: |
            histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[5m]))) > 1.5
          for: 15m
          labels: { severity: ticket }
          annotations:
            summary: API p95 latency above 1.5s
        - alert: LostFoundApiNotReady
          expr: kube_deployment_status_replicas_available{deployment="lost-found-api"} < 1
          for: 5m
          labels: { severity: page }
          annotations:
            summary: No ready API pods (check /readyz, migrations, RDS)
        - alert: LostFoundRateLimiting
          expr: sum(rate(http_request_duration_seconds_count{status="429"}[10m])) > 1
          for: 15m
          labels: { severity: ticket }
          annotations:
            summary: Sustained 429s — possible abuse or limits set too low
{{- end }}
